version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - python
  commit-message:
    prefix: deps
    prefix-development: deps-dev
    include: scope
  assignees:
  - hellqvio86
  cooldown:
    default-days: 3
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
    include: scope
  assignees:
  - hellqvio86
  cooldown:
    default-days: 3
